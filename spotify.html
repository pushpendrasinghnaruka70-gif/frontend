<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* MAIN LAYOUT */

        .container {
            display: flex;
            height: 100vh;
            padding-bottom: 90px;
        }

        /* SIDEBAR */

        .sidebar {
            width: 240px;
            background: #121212;
            padding: 25px 20px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .logo span {
            color: #1db954;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            padding: 14px 5px;
            color: #b3b3b3;
            cursor: pointer;
            font-size: 16px;
        }

        .menu li:hover {
            color: white;
        }

        .playlist-title {
            margin-top: 30px;
            margin-bottom: 15px;
            color: #b3b3b3;
            font-size: 14px;
            text-transform: uppercase;
        }

        /* CONTENT */

        .content {
            flex: 1;
            background: linear-gradient(#242424, #121212);
            padding: 25px;
            overflow-y: auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .arrows button {
            background: #000;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            margin-right: 8px;
            cursor: pointer;
        }

        .profile {
            background: #000;
            padding: 10px 18px;
            border-radius: 20px;
        }

        /* HEADINGS */

        h1 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        /* CARDS */

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 20px;
        }

        .card {
            background: #181818;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .card:hover {
            background: #282828;
            transform: translateY(-3px);
        }

        .album {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #1db954, #191414);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .card p {
            color: #b3b3b3;
            font-size: 13px;
        }

        /* SONG LIST */

        .songs {
            margin-top: 40px;
        }

        .song {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .song:hover {
            background: #282828;
        }

        .song-img {
            width: 50px;
            height: 50px;
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
        }

        .song-info {
            flex: 1;
        }

        .song-info p {
            color: #aaa;
            font-size: 13px;
            margin-top: 5px;
        }

        /* MUSIC PLAYER */

        .player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: #181818;
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 15px 25px;
            z-index: 10;
        }

        .now-playing {
            width: 25%;
            display: flex;
            align-items: center;
        }

        .cover {
            width: 55px;
            height: 55px;
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            margin-right: 12px;
        }

        .now-playing p {
            color: #aaa;
            font-size: 13px;
            margin-top: 5px;
        }

        .controls {
            width: 50%;
            text-align: center;
        }

        .control-buttons button {
            background: none;
            color: white;
            border: none;
            font-size: 22px;
            margin: 0 10px;
            cursor: pointer;
        }

        .control-buttons .play {
            background: white;
            color: black;
            border-radius: 50%;
            width: 38px;
            height: 38px;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .progress {
            flex: 1;
            height: 4px;
            background: #555;
            border-radius: 5px;
            cursor: pointer;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #1db954;
            border-radius: 5px;
        }

        .volume {
            width: 25%;
            text-align: right;
        }

        .volume input {
            width: 100px;
        }

        /* MOBILE */

        @media(max-width: 700px) {

            .sidebar {
                display: none;
            }

            .content {
                padding: 15px;
            }

            .player {
                padding: 10px;
            }

            .now-playing {
                width: 30%;
            }

            .now-playing div:last-child {
                display: none;
            }

            .volume {
                display: none;
            }

            .controls {
                width: 70%;
            }

            .control-buttons button {
                margin: 0 5px;
            }
        }

    </style>
</head>
